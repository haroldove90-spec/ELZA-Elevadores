<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B192C" />
      <stop offset="100%" stop-color="#1E3E62" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#67E8F9" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bg)" />

  <!-- Outer frame border with subtle glow -->
  <rect x="24" y="24" width="464" height="464" rx="80" fill="none" stroke="#38BDF8" stroke-opacity="0.3" stroke-width="4" />

  <!-- Elevator Hoistway / Shaft graphic -->
  <g transform="translate(136, 80)">
    <!-- Shaft rails -->
    <line x1="20" y1="20" x2="20" y2="240" stroke="#475569" stroke-width="6" stroke-linecap="round" />
    <line x1="220" y1="20" x2="220" y2="240" stroke="#475569" stroke-width="6" stroke-linecap="round" />

    <!-- Floor dividers / indicator lines -->
    <line x1="15" y1="80" x2="25" y2="80" stroke="#64748B" stroke-width="4" />
    <line x1="15" y1="140" x2="25" y2="140" stroke="#64748B" stroke-width="4" />
    <line x1="15" y1="200" x2="25" y2="200" stroke="#64748B" stroke-width="4" />
    <line x1="215" y1="80" x2="225" y2="80" stroke="#64748B" stroke-width="4" />
    <line x1="215" y1="140" x2="225" y2="140" stroke="#64748B" stroke-width="4" />
    <line x1="215" y1="200" x2="225" y2="200" stroke="#64748B" stroke-width="4" />

    <!-- Elevator Cab -->
    <rect x="40" y="55" width="160" height="150" rx="16" fill="#1E293B" stroke="url(#cyanGrad)" stroke-width="5" />
    
    <!-- Elevator Doors -->
    <rect x="52" y="70" width="64" height="120" rx="4" fill="#0F172A" stroke="#38BDF8" stroke-width="2" stroke-opacity="0.6" />
    <rect x="124" y="70" width="64" height="120" rx="4" fill="#0F172A" stroke="#38BDF8" stroke-width="2" stroke-opacity="0.6" />
    
    <!-- Door seam & handles -->
    <line x1="119" y1="70" x2="119" y2="190" stroke="#38BDF8" stroke-width="3" />
    <circle cx="112" cy="130" r="3" fill="#38BDF8" />
    <circle cx="126" cy="130" r="3" fill="#38BDF8" />

    <!-- Ascending Arrow (Up) -->
    <path d="M 85 40 L 120 12 L 155 40" fill="none" stroke="url(#accent)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Descending Arrow (Down) -->
    <path d="M 85 220 L 120 248 L 155 220" fill="none" stroke="#64748B" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Typography ELZE -->
  <text x="256" y="390" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="64" fill="#FFFFFF" letter-spacing="6">ELZE</text>
  <text x="256" y="425" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="20" fill="#38BDF8" letter-spacing="4">ELEVADORES</text>
  <text x="256" y="450" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="13" fill="#94A3B8" letter-spacing="2">INVERNADERO ELZE</text>
</svg>
